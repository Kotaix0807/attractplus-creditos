<?xml version="1.0"?>
<!-- Indices FIJOS de los mandos de la cabina.
     Sin esto, JOYCODE_N es el orden en que MAME enumera los mandos: al
     enchufar o quitar el mando de PS4, el panel se desplazaba entero y el
     boton de moneda dejaba de responder. De ahi que unos juegos tuvieran el
     mapeo en joy 1 y otros en joy 2: se configuraron en dias distintos.
     PS4      -> JOYCODE_1   el jugador 1 se maneja con el
     Xinmotek -> JOYCODE_2 y JOYCODE_3   el mueble, con el boton de moneda -->
<mameconfig version="10">
    <system name="default">
        <input>
            <mapdevice device="0300d0424c050000cc09000011810000" controller="JOYCODE_1" />
            <mapdevice device="0300b578c0160000e105000001010000" controller="JOYCODE_2" />
            <mapdevice device="0300b578c0160000e105000001010000" controller="JOYCODE_3" />
        </input>
    </system>
</mameconfig>
