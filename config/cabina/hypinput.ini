# Controles de Hypseus en la CABINA (copia versionada; vive en
# ~/hypseus-singe/hypinput.ini). Calcados de MAME (~/.mame/cfg/default.cfg):
#
#   MAME           mitad del panel     indice SDL   aqui
#   JOYCODE_1   -> 12 botones (P1)  -> mando 1   -> palanca -101/-102, espada 101,
#                                                   START1 109, SALIR 107 (UI_CANCEL)
#   JOYCODE_2   -> 10 botones (P2)  -> mando 0   -> MONEDA 007 (COIN1), START2 008
#
# Columna "Button": mando*100 + boton+1 (0 = ninguno). Ejes: +-(mando*100 + eje+1).
# OJO: SDL enumera PRIMERO la mitad de 10 botones (P2); MAME lo corrige con su
# ctrlr y Hypseus no puede, de ahi que P1 sea el mando 1. Si algun dia se invierte
# el orden, se invierte tambien en MAME (dependen del mismo orden de SDL).
[KEYBOARD]
KEY_UP         = SDLK_UP         0         0          -102
KEY_DOWN       = SDLK_DOWN       0         0          +102
KEY_LEFT       = SDLK_LEFT       0         0          -101
KEY_RIGHT      = SDLK_RIGHT      0         0          +101
KEY_COIN1      = SDLK_5          0         007
KEY_COIN2      = SDLK_6          0         0
KEY_START1     = SDLK_1          0         109
KEY_START2     = SDLK_2          0         008
KEY_BUTTON1    = SDLK_LCTRL      0         101
KEY_BUTTON2    = SDLK_LALT       0         102
KEY_BUTTON3    = SDLK_SPACE      0         103
KEY_SKILL1     = SDLK_LSHIFT     0         0
KEY_SKILL2     = SDLK_z          0         0
KEY_SKILL3     = SDLK_x          0         0
KEY_SERVICE    = SDLK_9          0         0
KEY_TEST       = SDLK_F2         SDLK_F4   0
KEY_RESET      = SDLK_0          0         0
KEY_SCREENSHOT = SDLK_F12        0         0
KEY_QUIT       = SDLK_ESCAPE     0         107
KEY_PAUSE      = SDLK_p          0         0
KEY_CONSOLE    = SDLK_BACKSLASH  0         0
KEY_TILT       = SDLK_t          0         0
END

[MOUSE]
MOUSE_BUTTON1  = KEY_BUTTON3
MOUSE_BUTTON2  = KEY_BUTTON1
MOUSE_BUTTON3  = KEY_BUTTON2
END

[GLOBAL]
#SCREEN        = 0
#VLDPVOLUME    = 40
#NONVLDPVOLUME = 10
SOUNDBUFFER    = 2048
#ALWAYSONTOP   = FALSE
#FULLSCREEN    = TRUE
#MANYMOUSE     = TRUE
GAMEPAD        = FALSE
#SCANLINES     = FALSE
GRAPHICAPI     = AUTO
END
