# Emulador de laserdisc (Hypseus Singe, sucesor de Daphne).
#
# Va aparte de GroovyMAME a proposito: en MAME el video del laserdisc no es
# jugable (se salta escenas y el arranque acelerado lo estropea), mientras que
# Hypseus esta hecho para esto. Los juegos siguen apareciendo MEZCLADOS en la
# misma lista del frontend, porque cada entrada de la romlist lleva su propio
# emulador en la tercera columna.
#
# workdir es imprescindible: hypseus busca ./roms, ./ram y ./pics con rutas
# relativas, asi que lanzado desde otro sitio no encuentra sus propias ROMs.
#
# rompath apunta a vldp/ y romext es <DIR>: cada juego es una carpeta con su
# video y su framefile, asi que AM+ los descubre solos al reconstruir la lista.
executable           /home/arcade/hypseus-singe/hypseus
args                 [name] vldp -framefile /home/arcade/hypseus-singe/vldp/[name]/[name].txt -fullscreen -sound_buffer 2048
workdir              /home/arcade/hypseus-singe
rompath              /home/arcade/hypseus-singe/vldp
romext               <DIR>
system               Laserdisc
info_source          
import_extras        /home/arcade/shared/frontends/attract/laserdisc.xml
exit_hotkey          
