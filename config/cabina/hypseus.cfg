# Emulador de laserdisc (Hypseus Singe, sucesor de Daphne).
#
# Va aparte de GroovyMAME a proposito: en MAME el video del laserdisc no es
# jugable (se salta escenas y el arranque acelerado lo estropea), mientras que
# Hypseus esta hecho para esto. Los juegos siguen apareciendo MEZCLADOS en la
# misma lista del frontend, porque cada entrada de la romlist lleva su propio
# emulador en la tercera columna.
#
# workdir es imprescindible: hypseus busca ./roms, ./ram y ./pics con rutas
# relativas, asi que lanzado desde otro sitio no encuentra sus propias ROMs.
#
# rompath apunta a vldp/ y romext es <DIR>: cada juego es una carpeta con su
# video y su framefile, asi que AM+ los descubre solos al reconstruir la lista.
# Se lanza por un envoltorio que avisa al demonio del panel (moneyBank.py) de
# que botones usa el juego, para encender solo esos LEDs; luego hace exec.
executable           /home/arcade/attractplus-creditos/creditos/lanzar_hypseus.sh
#
# -nosplash quita el logo de Hypseus al lanzar; -fastboot salta el test de
# RAM/ROM de la placa (el titulo sale a los ~4,5 s en vez de ~30).
#
# Ajustes POR JUEGO: si vldp/<juego>/args existe, se anaden sus opciones (AM+
# pasa los args por wordexp con sustitucion de ordenes). Hace falta porque el
# mismo DIP significa cosas distintas en cada ROM: en dle21, "-bank 0 11011100"
# es 1 moneda = 1 credito; en lair ese bit seria 3 monedas.
args                 [name] vldp -framefile /home/arcade/hypseus-singe/vldp/[name]/[name].txt -fullscreen -nosplash -fastboot -sound_buffer 2048 $(cat /home/arcade/hypseus-singe/vldp/[name]/args 2>/dev/null)
workdir              /home/arcade/hypseus-singe
rompath              /home/arcade/hypseus-singe/vldp
romext               <DIR>
system               Laserdisc
info_source          
import_extras        /home/arcade/shared/frontends/attract/laserdisc.xml
exit_hotkey          
