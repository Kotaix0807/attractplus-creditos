# Emulador GroovyMAME con insercion automatica de creditos.
#
# Copiar a  $HOME/.attract/emulators/groovymame.cfg  y ajustar rutas.
# Las claves validas estan en src/fe_info.cpp:1088 de attractplus.
#
# Lo importante son las dos opciones del final de "args":
#
#   -autoboot_script  el script Lua que mete las monedas
#   -autoboot_delay   0. Tiene que ser 0 para que el cerrojo del boton de
#                     moneda se monte ANTES de que el juego acepte nada: con un
#                     retardo, un jugador espabilado se regala creditos pulsando
#                     la moneda mientras el script todavia no existe.
#
#                     Antes hacia falta 6 o mas porque el script INSERTABA las
#                     monedas y la placa aun estaba en su test de RAM/ROM. Ya no
#                     inserta nada (el jugador mete lo que quiera con el boton),
#                     asi que ese motivo desaparecio. La RAM del juego se deja
#                     asentar aparte, con GA_ASENTAR.

executable           /home/eloy/groovymame_src/mame
args                 "[romfilename]" -autoboot_script /home/eloy/groovyarcade-creditos/creditos.lua -autoboot_delay 0
workdir              /home/eloy/groovymame_src
rompath              /usr/share/games/mame/roms
romext               .zip;.7z
system               mame
info_source          listxml
exit_hotkey          Escape
