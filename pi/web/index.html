<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de la cabina</title>

<!-- Pico.css: un CSS "sin clases". Con solo enlazarlo, el HTML de abajo ya se
     ve bien y responsivo. Esto es el atajo para no pelear con CSS al principio.
     (Version fijada a proposito; cualquiera sirve para empezar.) -->
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/picocss/2.0.6/pico.min.css">

<style>
  .oculto { display: none !important; }
  main.container { padding-top: 1rem; }
  header.cab { display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-bottom:1rem; }
  header.cab h1 { margin:0; font-size:1.4rem; }
  /* Estado en vivo: tres cifras; el juego ocupa toda la fila en movil */
  .estado { display:grid; gap:.8rem; grid-template-columns:repeat(2,1fr); margin-bottom:1rem; }
  .estado article { margin:0; padding:.8rem; text-align:center; }
  .estado .juego { grid-column:1 / -1; }
  .estado small { color:var(--pico-muted-color); }
  .grande { font-size:1.8rem; font-weight:700; line-height:1.2; }
  .estado .juego .grande { font-size:1.2rem; overflow-wrap:anywhere; }
  @media (min-width:768px) {
    .estado { grid-template-columns:1fr 1fr 2fr; }
    .estado .juego { grid-column:auto; }
  }
  /* Tarjetas de secciones: una columna en movil, dos en pantalla ancha */
  .secciones { display:grid; gap:1rem; grid-template-columns:1fr; }
  @media (min-width:768px) { .secciones { grid-template-columns:1fr 1fr; } }
  .secciones article { margin:0; }
  .secciones h3 { font-size:1rem; margin-bottom:.8rem; }
  .botones { display:grid; gap:.5rem; grid-template-columns:repeat(auto-fill,minmax(9rem,1fr)); }
  .botones > * { margin:0; width:100%; font-size:.9rem; padding:.55rem .5rem; }
  .ajuste label { display:flex; justify-content:space-between; font-size:.9rem; }
  .ajuste input[type=range] { margin-bottom:1rem; }
  .peligro { --pico-background-color:#c0392b; --pico-border-color:#c0392b; }
  .peligro.outline { --pico-color:#c0392b; --pico-border-color:#c0392b; background:none; }
  .botones.tres { grid-template-columns:repeat(3,1fr); }
  .ancha { grid-column:1 / -1; }
  #masjugados td:last-child { text-align:right; white-space:nowrap; color:var(--pico-muted-color); }
</style>
</head>

<body>
<main class="container">

  <!-- ======================= PANTALLA DE LOGIN ======================= -->
  <section id="login">
    <h1>Panel de la cabina</h1>
    <form id="form-login">
      <input type="password" id="clave" placeholder="Clave" required>
      <button type="submit">Entrar</button>
    </form>
    <small id="login-error" style="color:#c0392b"></small>

    <!-- Solo con la Pi delante: si la cabina esta apagada, se puede encender por
         Wake-on-LAN SIN iniciar sesion (el login no funciona con la cabina caida). -->
    <div id="apagada" class="oculto">
      <p><strong>La cabina está apagada.</strong></p>
      <button id="btn-encender">Encender cabina</button>
      <small id="encender-msg"></small>
    </div>
  </section>

  <!-- ======================= PANEL (tras login) ====================== -->
  <section id="panel" class="oculto">
    <header class="cab"><h1>Cabina</h1></header>

    <!-- Estado en vivo: se rellena solo cada 2 s -->
    <div class="estado">
      <article><small>Temperatura</small><div class="grande" id="temp">—</div></article>
      <article><small>CPU</small><div class="grande" id="cpu">—</div></article>
      <article class="juego"><small>Jugando ahora</small><div class="grande" id="juego">—</div></article>
    </div>

    <div class="secciones">
      <article>
        <h3>Páginas</h3>
        <div class="botones tres">
          <a href="/pantalla.html" role="button" class="secondary">📺 Pantalla</a>
          <a href="/puntajes.html" role="button" class="secondary">🏆 Puntajes</a>
          <a href="/tester.html" role="button" class="secondary">🎮 Test de botones</a>
        </div>
      </article>

      <article>
        <h3>Juego</h3>
        <div class="botones">
          <button id="btn-credito">+1 crédito</button>
          <button id="btn-salir">Salir del juego</button>
          <button id="btn-menu" class="secondary">Menú MAME</button>
          <button id="btn-menu-fe" class="secondary">Menú Attract</button>
        </div>
      </article>

      <article class="ajuste">
        <h3>Sonido y luces</h3>
        <!-- Volumen: lee el nivel actual al entrar y lo manda al soltar el slider -->
        <label for="volumen">Volumen <span id="volumen-val">—</span></label>
        <input type="range" id="volumen" min="0" max="100" value="80">
        <!-- Brillo de los LEDs: escala TODO lo que corra en el Arduino -->
        <label for="brillo">Brillo LEDs <span id="brillo-val">—</span></label>
        <input type="range" id="brillo" min="0" max="255" value="255">
        <!-- Prueba de sonido: tono suave por canal, para verificar los altavoces L/R -->
        <label>Prueba de altavoces</label>
        <div class="botones tres">
          <button class="outline" onclick="accion('/api/sonido/prueba',{canal:'izquierda'})">🔈 Izquierda</button>
          <button class="outline" onclick="accion('/api/sonido/prueba',{canal:'derecha'})">🔈 Derecha</button>
          <button class="outline" onclick="accion('/api/sonido/prueba',{canal:'ambos'})">🔊 Ambos</button>
        </div>
      </article>

      <article>
        <h3>Tarifa (todos los juegos)</h3>
        <select id="tarifa-global">
          <option value="defecto">Normal — 1 moneda / crédito</option>
          <option value="freeplay">Free Play (gratis)</option>
          <option value="200">$200 — 2 monedas / crédito</option>
          <option value="300">$300 — 3 monedas / crédito</option>
          <option value="400">$400 — 4 monedas / crédito</option>
        </select>
        <h3>Reiniciar servicios</h3>
        <div class="botones tres">
          <button id="btn-frontend" class="secondary">Frontend</button>
          <button id="btn-monedero" class="secondary">Monedero</button>
          <button id="btn-arduino" class="secondary">Arduino</button>
        </div>
      </article>

      <article>
        <h3>Más jugados</h3>
        <table><tbody id="masjugados"></tbody></table>
      </article>

      <article>
        <h3>Energía</h3>
        <div class="botones tres">
          <button id="btn-suspender" class="secondary" title="Se puede volver a encender por red">Suspender</button>
          <button id="btn-reiniciar" class="peligro">Reiniciar cabina</button>
          <button id="btn-apagar" class="peligro outline" title="Así NO se podrá encender por red">Apagar</button>
        </div>
        <small>Suspender permite encenderla luego por red; apagar no.</small>
      </article>
    </div>

  </section>
</main>

<script>
// ===========================================================================
//  TODA la logica de la pagina. Fijate que solo son dos cosas repetidas:
//    1) pedir datos:   fetch('/api/...')  ->  poner el resultado en el HTML
//    2) ejecutar algo: fetch('/api/...', { method: 'POST' })
// ===========================================================================

let TOKEN = "";   // el token CSRF que da el login; va en cada accion

// -- atajo para escribir en un elemento por su id --
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// -- ¿La cabina esta encendida? (solo responde si hay Pi/portero delante) ------
// Si esta apagada, muestra el boton Encender en vez del login.
async function comprobarPuerta() {
  try {
    const r = await fetch("/api/puerta");
    if (!r.ok) return;                 // sin portero (acceso directo): asume encendida
    const d = await r.json();
    const apagada = d.cabina_online === false;
    $("form-login").classList.toggle("oculto", apagada);
    $("apagada").classList.toggle("oculto", !apagada);
  } catch (e) { /* sin /api/puerta: login normal */ }
}

// -- ENCENDER (Wake-on-LAN): no necesita sesion, lo atiende la Pi -------------
async function encender() {
  $("encender-msg").textContent = " encendiendo…";
  await fetch("/api/accion/encender", { method: "POST" });
  // espera a que la cabina conteste y entonces muestra el login
  const esperar = setInterval(async () => {
    const r = await fetch("/api/puerta").then((x) => x.json()).catch(() => ({}));
    if (r.cabina_online) {
      clearInterval(esperar);
      $("encender-msg").textContent = " ¡encendida!";
      comprobarPuerta();
    }
  }, 3000);
}

// -- LOGIN -----------------------------------------------------------------
$("form-login").addEventListener("submit", async (ev) => {
  ev.preventDefault();                       // que no recargue la pagina
  const r = await fetch("/api/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ clave: $("clave").value }),
  });
  if (!r.ok) { $("login-error").textContent = "Clave incorrecta"; return; }
  const d = await r.json();
  TOKEN = d.csrf;                            // lo guardamos para las acciones
  $("login").classList.add("oculto");
  $("panel").classList.remove("oculto");
  arrancarPanel();
});

// -- helper para ejecutar una accion (POST con el token) -------------------
async function accion(ruta, cuerpo) {
  const r = await fetch(ruta, {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-CSRF-Token": TOKEN },
    body: JSON.stringify(cuerpo || {}),
  });
  return r.json();
}

// -- LEER ESTADO cada 2 s y pintarlo --------------------------------------
async function refrescarEstado() {
  try {
    const r = await fetch("/api/estado");
    if (!r.ok) throw 0;              // 503 = cabina apagada/suspendida (via portero)
    const d = await r.json();
    $("temp").textContent = d.temperatura_c + " °C";
    $("cpu").textContent  = d.cpu.uso_pct + " %";
    $("juego").textContent = d.juego_actual ? d.juego_actual.titulo : "menú";
  } catch (e) {
    // La cabina dejó de responder (p.ej. tras Suspender): mostrar Encender.
    $("panel").classList.add("oculto");
    $("form-login").classList.add("oculto");
    $("apagada").classList.remove("oculto");
    $("login").classList.remove("oculto");
  }
}

// -- LEER la lista de mas jugados (una vez) --------------------------------
async function cargarMasJugados() {
  const lista = await (await fetch("/api/masjugados?limite=8")).json();
  $("masjugados").innerHTML = lista.map(
    (j) => `<tr><td>${esc(j.titulo)}</td><td>${esc(j.partidas)} partidas</td></tr>`
  ).join("");
}

// -- conectar los botones --------------------------------------------------
function arrancarPanel() {
  refrescarEstado();
  setInterval(refrescarEstado, 2000);        // en vivo
  cargarMasJugados();

  // volumen: leer el nivel actual, actualizar la etiqueta al arrastrar, y
  // mandarlo al soltar (onchange) para no saturar amixer en cada pixel.
  fetch("/api/volumen").then((r) => r.json()).then((d) => {
    if (d.nivel != null) { $("volumen").value = d.nivel; }
    $("volumen-val").textContent = (d.nivel != null ? d.nivel : "?") + " %";
  });
  $("volumen").oninput  = () => { $("volumen-val").textContent = $("volumen").value + " %"; };
  $("volumen").onchange = () => accion("/api/volumen", { nivel: Number($("volumen").value) });

  // brillo de los LEDs: igual que el volumen. Escala cualquier animacion/juego en marcha.
  fetch("/api/leds/brillo").then((r) => r.json()).then((d) => {
    $("brillo").value = d.brillo;
    $("brillo-val").textContent = d.brillo;
  });
  $("brillo").oninput  = () => { $("brillo-val").textContent = $("brillo").value; };
  $("brillo").onchange = () => accion("/api/leds/brillo", { brillo: Number($("brillo").value) });
  fetch("/api/tarifa-global").then((r) => r.json()).then((d) => {
    $("tarifa-global").value = d.modo === "pesos" ? String(d.pesos)
      : (d.modo === "freeplay" ? "freeplay" : "defecto");
  });
  $("tarifa-global").onchange = () => accion("/api/tarifa-global", { valor: $("tarifa-global").value });

  $("btn-credito").onclick  = () => accion("/api/creditos", { n: 1 });
  $("btn-menu").onclick      = () => accion("/api/juego/menu");   // abre/cierra el menú de MAME (TAB)
  $("btn-menu-fe").onclick   = () => accion("/api/frontend/menu"); // menú de Attract
  $("btn-salir").onclick    = () => accion("/api/juego/salir");
  $("btn-monedero").onclick = () => accion("/api/monedero/reiniciar");
  $("btn-arduino").onclick = () => accion("/api/arduino/reiniciar");
  $("btn-frontend").onclick = () => accion("/api/frontend/reiniciar");
  $("btn-reiniciar").onclick = () => {
    if (confirm("¿Reiniciar la cabina?")) accion("/api/accion/reiniciar");
  };
  $("btn-suspender").onclick = () => {
    if (confirm("¿Suspender la cabina? (luego se puede encender por red)"))
      accion("/api/accion/suspender");
  };
  $("btn-apagar").onclick = () => {
    if (confirm("¿Apagar del todo? OJO: así NO se podrá encender por red."))
      accion("/api/accion/apagar");
  };
}

// -- al cargar: conectar Encender y ver si la cabina esta apagada --
$("btn-encender").onclick = encender;
// Si ya hay sesion (p.ej. al volver de Pantalla/Puntajes/Test), entrar sin pedir la clave
fetch("/api/sesion").then((r) => r.ok ? r.json() : {}).then((d) => {
  if (!d.autenticado) return comprobarPuerta();
  TOKEN = d.csrf;
  $("login").classList.add("oculto");
  $("panel").classList.remove("oculto");
  arrancarPanel();
}).catch(comprobarPuerta);
</script>
</body>
</html>
