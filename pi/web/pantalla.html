<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Pantalla de la cabina</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #000; color: #cfcfcf;
         font-family: system-ui, -apple-system, sans-serif;
         min-height: 100vh; display: flex; flex-direction: column;
         align-items: center; justify-content: center; }
  #img { max-width: 100%; max-height: 100vh; image-rendering: pixelated; display: none; }
  #msg { padding: 1.5rem; text-align: center; line-height: 1.6; max-width: 34rem; }
  #msg a { color: #6cf; }
  #barra { position: fixed; top: 0; left: 0; right: 0; z-index: 2;
           display: flex; gap: .6rem; align-items: center;
           padding: .4rem .7rem; background: rgba(0,0,0,.55);
           font-size: .85rem; opacity: .15; transition: opacity .2s; }
  #barra:hover, #barra:focus-within { opacity: 1; }
  #barra .sp { margin-left: auto; }
  button { background: #222; color: #ccc; border: 1px solid #444;
           border-radius: 5px; padding: .3rem .7rem; cursor: pointer; }
  button:hover { background: #333; }
</style>
</head>
<body>
  <div id="barra">
    <strong>Cabina</strong>
    <span id="estado">conectando…</span>
    <span id="fps"></span>
    <label class="sp"><input type="checkbox" id="fit" checked> ajustar</label>
    <button id="pausa">pausa</button>
  </div>
  <img id="img" alt="pantalla de la cabina">
  <div id="msg"></div>
<script>
(function () {
  // Fotogramas JPEG sueltos encadenados (peticiones cortas): render fiable en todo
  // navegador y no se rompe con VPN/proxy que bufferizan un stream largo (lo que
  // dejaba el MJPEG en negro). Se pide el siguiente en cuanto llega el anterior.
  var img = document.getElementById('img'),
      msg = document.getElementById('msg'),
      estado = document.getElementById('estado'),
      fpsEl = document.getElementById('fps'),
      pausa = document.getElementById('pausa'),
      fit = document.getElementById('fit'),
      activo = true, t0 = 0, n = 0, url = null;

  function liberar() { if (url) { URL.revokeObjectURL(url); url = null; } }

  async function tick() {
    if (!activo) return;
    try {
      var r = await fetch('/api/pantalla.jpg?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) throw new Error(r.status);
      var blob = await r.blob();
      liberar();
      url = URL.createObjectURL(blob);
      img.src = url;                      // onload encadena el siguiente
    } catch (e) {
      img.style.display = 'none';
      estado.textContent = 'sin señal';
      msg.innerHTML = 'No se ve la pantalla.<br>' +
        'Inicia sesión en el <a href="/">panel</a> y vuelve aquí,<br>' +
        'o puede que la cabina esté apagada.';
      setTimeout(tick, 1500);
    }
  }

  img.onload = function () {
    img.style.display = ''; msg.textContent = ''; estado.textContent = 'en vivo';
    n++;
    var ahora = performance.now();
    if (!t0) t0 = ahora;
    else if (ahora - t0 > 1000) { fpsEl.textContent = Math.round(n * 1000 / (ahora - t0)) + ' fps'; t0 = ahora; n = 0; }
    if (activo) tick();                   // siguiente fotograma ya
  };

  pausa.onclick = function () {
    activo = !activo;
    pausa.textContent = activo ? 'pausa' : 'seguir';
    if (activo) { estado.textContent = 'conectando…'; tick(); }
    else { estado.textContent = 'en pausa'; }
  };
  fit.onchange = function () {
    img.style.maxHeight = fit.checked ? '100vh' : 'none';
    img.style.maxWidth = fit.checked ? '100%' : 'none';
  };
  document.addEventListener('visibilitychange', function () {
    if (!activo) return;
    if (!document.hidden) tick();
  });
  tick();
})();
</script>
</body>
</html>
