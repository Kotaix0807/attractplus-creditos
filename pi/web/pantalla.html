<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Pantalla de la cabina</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #000; color: #cfcfcf;
         font-family: system-ui, -apple-system, sans-serif;
         min-height: 100vh; display: flex; flex-direction: column;
         align-items: center; justify-content: center; }
  #video { max-width: 100%; max-height: 100vh; image-rendering: pixelated; background: #000; }
  #msg { padding: 1.5rem; text-align: center; line-height: 1.6; max-width: 34rem; display: none; }
  #msg a { color: #6cf; }
  #barra { position: fixed; top: 0; left: 0; right: 0; z-index: 2;
           display: flex; gap: .6rem; align-items: center;
           padding: .4rem .7rem; background: rgba(0,0,0,.55);
           font-size: .85rem; opacity: .15; transition: opacity .2s; }
  #barra:hover, #barra:focus-within { opacity: 1; }
  #barra .sp { margin-left: auto; }
  button, select { background: #222; color: #ccc; border: 1px solid #444;
           border-radius: 5px; padding: .3rem .7rem; cursor: pointer; }
  button:hover, select:hover { background: #333; }
</style>
</head>
<body>
  <div id="barra">
    <strong>Cabina</strong>
    <span id="estado">conectando…</span>
    <select id="cal" title="calidad / ancho de banda">
      <option value="ancho=480&kbps=800" selected>Fluido</option>
      <option value="ancho=640&kbps=1500">Equilibrio</option>
      <option value="ancho=960&kbps=3000">Nítido</option>
    </select>
    <label class="sp"><input type="checkbox" id="fit" checked> ajustar</label>
    <button id="pausa">pausa</button>
  </div>
  <video id="video" muted playsinline></video>
  <div id="msg"></div>
<script>
(function () {
  // Pantalla en vivo por H.264 (MP4 fragmentado) con MediaSource.
  // CLAVE de la fluidez: NO reproducir pegado al borde en vivo. Primero se acumula
  // un COLCHON (COJIN s) de buffer y recien ahi se reproduce, quedando ese colchon
  // por detras del borde. Asi un hipo de red no vacia el buffer (que daba tirones).
  var MIME = 'video/mp4; codecs="avc1.42E01F"';   // baseline 3.1 (lo que emite x264)
  var COJIN = 2.0;                                 // segundos de colchon antes de play
  var video = document.getElementById('video'),
      msg = document.getElementById('msg'),
      estado = document.getElementById('estado'),
      cal = document.getElementById('cal'),
      pausa = document.getElementById('pausa'),
      fit = document.getElementById('fit'),
      activo = true, ms = null, sb = null, cola = [], reader = null,
      abort = null, reproduciendo = false,
      ultCal = 0, ultFrames = 0, diag = '';   // diagnostico: fps decodificados + perdidos

  function parar() {
    try { if (abort) abort.abort(); } catch (e) {}
    try { if (reader) reader.cancel(); } catch (e) {}
    reader = null; abort = null; cola = []; sb = null; reproduciendo = false;
    try { if (ms && ms.readyState === 'open') ms.endOfStream(); } catch (e) {}
    ms = null;
    try { video.pause(); video.removeAttribute('src'); video.load(); } catch (e) {}
  }

  function recortar() {              // tira lo ya visto: evita QuotaExceeded
    try {
      if (sb && !sb.updating && sb.buffered.length &&
          video.currentTime - sb.buffered.start(0) > 8)
        sb.remove(sb.buffered.start(0), video.currentTime - 4);
    } catch (e) {}
  }
  function bombear() {
    if (!sb || sb.updating || !cola.length) return;
    try { sb.appendBuffer(cola[0]); cola.shift(); }
    catch (e) { if (e.name === 'QuotaExceededError') recortar(); }
  }

  function trasAppend() {
    recortar();
    // Arrancar la reproduccion SOLO cuando hay colchon suficiente.
    if (!reproduciendo && sb && sb.buffered.length) {
      var ini = sb.buffered.start(0), fin = sb.buffered.end(sb.buffered.length - 1);
      if (fin - ini >= COJIN) {
        reproduciendo = true;
        try { video.currentTime = ini; } catch (e) {}
        video.play().catch(function () {});
        estado.textContent = 'en vivo';
      }
    }
    bombear();
  }

  function vigilar() {               // mantiene el colchon, sin saltos bruscos
    if (!reproduciendo) return;
    try {
      var b = video.buffered;
      if (!b.length) return;
      var retardo = b.end(b.length - 1) - video.currentTime;
      if (retardo > 8) video.currentTime = b.end(b.length - 1) - COJIN;   // resync raro
      else if (retardo > COJIN + 2) video.playbackRate = 1.05;            // recupera suave
      else if (retardo <= COJIN + 0.5) video.playbackRate = 1.0;
      // diagnostico: fps que el navegador DECODIFICA y cuadros que DESCARTA
      if (video.getVideoPlaybackQuality) {
        var q = video.getVideoPlaybackQuality(), t = performance.now();
        if (t - ultCal > 1000) {
          var fps = ((q.totalVideoFrames - ultFrames) * 1000 / (t - ultCal)).toFixed(0);
          diag = ' · ' + fps + 'fps dec · ' + q.droppedVideoFrames + ' perd';
          ultCal = t; ultFrames = q.totalVideoFrames;
        }
      }
      estado.textContent = 'en vivo · buf ' + retardo.toFixed(1) + 's' +
                           (video.playbackRate !== 1 ? ' ·' + video.playbackRate + '×' : '') + diag;
    } catch (e) {}
  }

  function fallo(t) {
    parar();
    video.style.display = 'none'; estado.textContent = 'sin señal';
    msg.style.display = ''; msg.innerHTML = (t || 'Se cortó la conexión.') + '<br>' +
      'Inicia sesión en el <a href="/">panel</a> y vuelve aquí,<br>' +
      'o puede que la cabina esté apagada.';
    if (activo) setTimeout(arrancar, 2500);
  }

  function arrancar() {
    if (!activo) return;
    parar();
    if (!('MediaSource' in window) || !MediaSource.isTypeSupported(MIME))
      return fallo('Tu navegador no soporta reproducción H.264 por MSE.');
    estado.textContent = 'cargando…';
    video.style.display = ''; msg.style.display = 'none';
    ms = new MediaSource();
    video.src = URL.createObjectURL(ms);
    ms.addEventListener('sourceopen', function () {
      try {
        sb = ms.addSourceBuffer(MIME);
        sb.mode = 'sequence';
        sb.addEventListener('updateend', trasAppend);
        abort = new AbortController();
        fetch('/api/pantalla.mp4?' + cal.value + '&t=' + Date.now(),
              { signal: abort.signal, cache: 'no-store' })
          .then(function (r) {
            if (!r.ok) throw new Error(r.status);
            reader = r.body.getReader();
            (function leer() {
              reader.read().then(function (p) {
                if (p.done || !activo) return;
                cola.push(p.value); bombear(); leer();
              }).catch(function () { if (activo) fallo(); });
            })();
          })
          .catch(function () { if (activo) fallo(); });
      } catch (e) { if (activo) fallo(); }
    }, { once: true });
  }

  video.addEventListener('timeupdate', vigilar);
  cal.onchange = arrancar;           // cambia calidad y reabre el stream
  pausa.onclick = function () {
    activo = !activo;
    pausa.textContent = activo ? 'pausa' : 'seguir';
    if (activo) arrancar();
    else { parar(); estado.textContent = 'en pausa'; }
  };
  fit.onchange = function () {
    video.style.maxHeight = fit.checked ? '100vh' : 'none';
    video.style.maxWidth = fit.checked ? '100%' : 'none';
  };
  arrancar();
})();
</script>
</body>
</html>
