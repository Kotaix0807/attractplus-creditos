<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Pantalla de la cabina</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #000; color: #cfcfcf;
         font-family: system-ui, -apple-system, sans-serif;
         min-height: 100vh; display: flex; flex-direction: column;
         align-items: center; justify-content: center; }
  /* OJO: nada de "display:none" aqui. Un #img{display:none} en la hoja de estilos
     gana a img.style.display='' (que solo borra el estilo en linea), y dejaba la
     imagen oculta para siempre aunque el stream llegara -> pantalla en negro. */
  #img { max-width: 100%; max-height: 100vh; image-rendering: pixelated; }
  #msg { padding: 1.5rem; text-align: center; line-height: 1.6; max-width: 34rem; display: none; }
  #msg a { color: #6cf; }
  #barra { position: fixed; top: 0; left: 0; right: 0; z-index: 2;
           display: flex; gap: .6rem; align-items: center;
           padding: .4rem .7rem; background: rgba(0,0,0,.55);
           font-size: .85rem; opacity: .15; transition: opacity .2s; }
  #barra:hover, #barra:focus-within { opacity: 1; }
  #barra .sp { margin-left: auto; }
  button, select { background: #222; color: #ccc; border: 1px solid #444;
           border-radius: 5px; padding: .3rem .7rem; cursor: pointer; }
  button:hover, select:hover { background: #333; }
</style>
</head>
<body>
  <div id="barra">
    <strong>Cabina</strong>
    <span id="estado">conectando…</span>
    <select id="cal" title="calidad / fluidez (si va a tirones, elige Fluido)">
      <option value="ancho=360&calidad=18" selected>Fluido</option>
      <option value="ancho=480&calidad=12">Equilibrio</option>
      <option value="ancho=720&calidad=7">Nítido</option>
    </select>
    <label class="sp"><input type="checkbox" id="fit" checked> ajustar</label>
    <button id="pausa">pausa</button>
  </div>
  <img id="img" alt="pantalla de la cabina">
  <div id="msg"></div>
<script>
(function () {
  // Stream MJPEG (multipart/x-mixed-replace): UNA conexion que el navegador
  // repinta en cada fotograma. Fluido, sin una peticion por cuadro, poco retardo.
  // No dependemos de img.onload: en multipart no dispara de forma fiable.
  // Los fps los limita el ancho de banda (el shader CRT comprime mal en JPEG),
  // asi que el selector cambia tamano/compresion en caliente para encajar.
  var img = document.getElementById('img'),
      msg = document.getElementById('msg'),
      estado = document.getElementById('estado'),
      cal = document.getElementById('cal'),
      pausa = document.getElementById('pausa'),
      fit = document.getElementById('fit'),
      activo = true;

  function arrancar() {
    if (!activo) return;
    estado.textContent = 'en vivo';
    img.style.display = '';
    msg.style.display = 'none';
    img.src = '/api/pantalla.mjpeg?' + cal.value + '&t=' + Date.now();
  }

  img.onerror = function () {
    img.style.display = 'none';
    estado.textContent = 'sin señal';
    msg.style.display = '';
    msg.innerHTML = 'No se ve la pantalla.<br>' +
      'Inicia sesión en el <a href="/">panel</a> y vuelve aquí,<br>' +
      'o puede que la cabina esté apagada.';
    if (activo) setTimeout(arrancar, 2000);
  };

  cal.onchange = arrancar;   // cambia la calidad y reabre el stream al vuelo
  pausa.onclick = function () {
    activo = !activo;
    pausa.textContent = activo ? 'pausa' : 'seguir';
    if (activo) { estado.textContent = 'conectando…'; arrancar(); }
    else { img.src = ''; estado.textContent = 'en pausa'; }
  };
  fit.onchange = function () {
    img.style.maxHeight = fit.checked ? '100vh' : 'none';
    img.style.maxWidth = fit.checked ? '100%' : 'none';
  };
  arrancar();
})();
</script>
</body>
</html>
