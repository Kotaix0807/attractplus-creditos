# /etc/nginx/sites-available/default del Raspberry Pi: la UNICA entrada al panel.
# Solo deja pasar a los aparatos de Tailscale (100.64.0.0/10 y su rango IPv6);
# cualquiera de la red de casa recibe un 403.  El portero escucha en
# 127.0.0.1:8081, asi que no hay otro camino.  Tras editarlo: sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 8080;              # la direccion vieja (:8080) sigue valiendo
    listen [::]:8080;
    server_name _;

    allow 100.64.0.0/10;
    allow fd7a:115c:a1e0::/48;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
        proxy_buffering off;          # para SSE (eventos en vivo)
    }
}
