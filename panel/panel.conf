# Configuracion del panel web de la cabina.  Formato: clave=valor.
# Cada clave se puede sobreescribir por entorno con PANEL_<CLAVE en mayusculas>,
# p.ej.  PANEL_PUERTO=9000.  Las lineas que empiezan por # son comentarios.
#
# Este fichero es la PLANTILLA del repo.  instalar.sh (tarea panel) copia una
# version a ~/.config/panel.conf la primera vez y no la vuelve a pisar, para que
# los cambios locales (la clave, sobre todo) sobrevivan a un git pull.

# Puerto local donde escucha el panel.  Solo lo alcanza cloudflared (127.0.0.1).
puerto=8808

# Valor de cada moneda, en pesos chilenos.  La cabina usa monedas de $100.
# Los ingresos se calculan como  monedas * valor_moneda.
valor_moneda=100

# Paso al cambiar la tarifa de un juego, en pesos.  Una moneda = $100, asi que
# la tarifa sube de 100 en 100:  $100 (1 moneda/credito), $200 (2/credito)...
paso_tarifa=100

# Umbral de temperatura (grados C) a partir del cual el panel avisa.
temp_aviso=80

# Contrasena del panel, guardada como hash SHA-256 en hexadecimal.
# Vacio = clave por defecto 'arcade' (CAMBIALA).  Para generar el hash:
#   python3 -c 'import hashlib,getpass;print(hashlib.sha256(getpass.getpass().encode()).hexdigest())'
clave_hash=
